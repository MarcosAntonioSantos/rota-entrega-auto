<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otimizar Rota de Entrega</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 1100px; margin: 20px auto; padding: 0 16px; color: #222; background: #f5f7fa; }
  h1 { color: #004080; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin: 16px 0; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  button { background: #004080; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  button:disabled { background: #999; }
  input[type=file] { padding: 8px; width: 100%; }
  .status { margin: 12px 0; padding: 10px; border-radius: 6px; background: #eef; }
  .err { background: #fee; color: #900; }
  .ok { background: #efe; color: #060; }
  .downloads a { display: inline-block; margin: 6px 8px 6px 0; padding: 8px 12px; background: #2e75b6; color: #fff; text-decoration: none; border-radius: 5px; }
  .progress { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .progress > div { height: 100%; background: #004080; width: 0%; transition: width .2s; }
  /* report styles */
  #report { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-top: 16px; }
  #report .title { text-align: center; font-size: 22px; font-weight: 700; color: #004080; margin: 0 0 4px; }
  #report .subtitle { text-align: center; font-size: 13px; color: #555; margin: 0 0 12px; }
  #report .legend { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: #444; margin: 8px 0 14px; }
  #report .legend span::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
  #report .legend .l1::before { background: #004080; }
  #report .legend .l2::before { background: #004080; }
  #report .legend .l3::before { background: #c00000; }
  #report .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  #report .bairro { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; margin-bottom: 10px; break-inside: avoid; }
  #report .bairro-header { background: #004080; color: #fff; padding: 6px 8px; font-weight: 700; font-size: 12px; }
  #report .row { display: grid; grid-template-columns: 34px 1fr 70px 40px; gap: 4px; padding: 4px 8px; border-top: 1px solid #f0f0f0; font-size: 11px; align-items: center; }
  #report .row .num { font-weight: 700; color: #004080; }
  #report .row .addr { color: #222; }
  #report .row .seq { color: #666; }
  #report .row .cnt { font-weight: 700; text-align: right; }
  #report .row .cnt.multi { color: #c00000; }
  #report .consolidated { padding: 2px 8px 6px; font-size: 10px; color: #c00000; font-style: italic; }
</style>
</head>
<body>
<h1>Otimizar Rota de Entrega</h1>
<p>Faça upload da planilha (.xlsx) para gerar a rota otimizada, a planilha final e o relatório visual.</p>

<div class="card">
  <input type="file" id="fileInput" accept=".xlsx,.xls">
  <br><br>
  <label><input type="checkbox" id="geocodeChk"> Corrigir coordenadas via geocodificação (Nominatim/OSM) — mais lento</label>
  <br><br>
  <button id="processBtn" disabled>Processar</button>
  <div class="progress"><div id="bar"></div></div>
  <div id="status" class="status">Aguardando arquivo...</div>
</div>

<div class="card" id="downloadsCard" style="display:none;">
  <h3>Arquivos para download</h3>
  <div class="downloads" id="downloads"></div>
</div>

<div id="reportWrap" style="display:none;">
  <div id="report"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const processBtn = document.getElementById('processBtn');
const statusEl = document.getElementById('status');
const bar = document.getElementById('bar');
const downloadsCard = document.getElementById('downloadsCard');
const downloadsDiv = document.getElementById('downloads');
const reportWrap = document.getElementById('reportWrap');
const reportEl = document.getElementById('report');

let selectedFile = null;
fileInput.addEventListener('change', e => {
  selectedFile = e.target.files[0];
  processBtn.disabled = !selectedFile;
  statusEl.textContent = selectedFile ? 'Arquivo: ' + selectedFile.name : 'Aguardando arquivo...';
  statusEl.className = 'status';
});

processBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  processBtn.disabled = true;
  downloadsCard.style.display = 'none';
  reportWrap.style.display = 'none';
  downloadsDiv.innerHTML = '';
  try {
    await processFile(selectedFile);
  } catch (err) {
    statusEl.textContent = 'Erro: ' + err.message;
    statusEl.className = 'status err';
  } finally {
    processBtn.disabled = false;
  }
});

function setProgress(p, msg) {
  bar.style.width = p + '%';
  if (msg) statusEl.textContent = msg;
}

function stdCep(v) {
  const digits = String(v).replace(/\D/g, '');
  return digits.length === 8 ? digits : String(v).trim();
}

function parseAddress(raw) {
  let s = String(raw).trim();
  s = s.replace(/\bQ(\d+)LT(\d+)\b/gi, 'Qd $1 Lt $2');
  s = s.replace(/\bQ(\d+)L(\d+)\b/gi, 'Qd $1 Lt $2');
  s = s.replace(/\bKD(\d+)LT(\d+)\b/gi, 'Qd $1 Lt $2');
  let qd = null, lt = null;
  let m = s.match(/\b(?:kd|qd|quadra|q)\.?\s*([A-Za-z0-9\-]+)/i);
  if (m) { qd = m[1].toUpperCase().replace('.',''); s = s.replace(m[0], ' ', 1); }
  m = s.match(/\b(?:lt|lote|lot|l)\.?\s*([0-9][A-Za-z0-9\-]*)/i);
  if (m) { lt = m[1].toUpperCase().replace('.',''); s = s.replace(m[0], ' ', 1); }
  const parts = s.split(',').map(p=>p.trim()).filter(Boolean);
  let streetIdx = 0;
  for (let i=0;i<parts.length;i++){
    const first = (parts[i].split(/\s+/)[0]||'').toLowerCase().replace(/[^a-z]/g,'');
    if (['rua','avenida','av','travessa','trav','alameda','al','estrada','rodovia'].includes(first)) { streetIdx=i; break; }
  }
  let streetPart = parts[streetIdx] || s.trim();
  let street = streetPart.replace(/^Avenida\b/i,'Av.').replace(/^Travessa\b/i,'Trav.').replace(/^R\b(?!\.)/i,'R.').replace(/^Trav\b(?!\.)/i,'Trav.').replace(/\s+/g,' ').trim();
  const NO_NUM = new Set(['sn','s/n','s n','sem','sem n','n/a','n a','-','','0','00','000','0000']);
  let numero = null;
  const obsParts = [];
  for (let i=0;i<parts.length;i++){
    if (i===streetIdx) continue;
    const cand = parts[i].trim();
    const low = cand.toLowerCase();
    if (NO_NUM.has(low) || low.startsWith('sem')) continue;
    if (/residencial|condominio|cond\.?|bairro|setor|jardim|vila|parque|loteamento/i.test(cand)) continue;
    if (numero === null && /^\d+[a-z]?(\/*\d+[a-z]?)?$/i.test(cand)) { numero = cand; }
    else obsParts.push(cand);
  }
  const obs = obsParts.join(', ').replace(/\s+/g,' ').trim();
  const comps = [street];
  if (qd) comps.push('Qd. ' + qd);
  if (lt) comps.push('Lt. ' + lt);
  if (numero !== null) comps.push('nº ' + numero);
  if (obs) comps.push(obs);
  const formatted = comps.join(', ');
  const warns = [];
  if (!qd) warns.push('faltando quadra');
  if (!lt) warns.push('faltando lote');
  if (numero === null) warns.push('faltando número');
  return { formatted, warns };
}

function coreKey(addr) {
  let s = addr.toLowerCase();
  for (const w of ['rua','avenida','av.','av','travessa','trav.','trav','alameda','al.','al','quadra','qd.','qd','lote','lt.','lt','lot']) {
    s = s.replace(new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g'), ' ');
  }
  s = s.replace(/q(?=\d)/g,'').replace(/l(?=\d)/g,'').replace(/[^a-z0-9]/g,'');
  return s;
}
function buildingCore(raw) {
  const s = String(raw);
  let m = s.match(/(?:cond\.?|condominio|residencial|ed\.?|edificio|predio|torre|bloco|loteamento|conjunto|res\.?)\s+(.+)/i);
  if (m) {
    let tail = m[1].split(/\b(?:apto|ap\.?|ap|bl\.?|bloco|apt|apt\.|casa|lt\.?|lote|qd\.?|quadra|b\d)\b/i)[0];
    tail = tail.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
    if (tail.length >= 3) return tail;
  }
  // capitalized phrase not in street position
  const parts = s.split(',').map(p=>p.trim()).filter(Boolean);
  let streetIdx = null;
  for (let i=0;i<parts.length;i++) if (/\b(rua|avenida|av\.?|travessa|alameda|estrada|rodovia)\b/i.test(parts[i])) { streetIdx=i; break; }
  const cands = streetIdx===null ? parts : parts.filter((_,i)=>i!==streetIdx);
  for (const p of cands) {
    let cleaned = p.replace(/\b(?:apto|ap\.?|ap|bl\.?|bloco|apt|apt\.|casa|lt\.?|lote|qd\.?|quadra|b\d|nº|no)\b\.?\s*\S*/gi,'');
    cleaned = cleaned.replace(/\b\d+[-.]?\d*\b/g,'').trim();
    if (!/[A-Z]/.test(cleaned)) continue;
    let norm = cleaned.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
    if (norm.split(' ').length >= 2 && norm.length >= 8) return norm;
  }
  // whole-string capitalized phrase
  if (parts.length === 1) {
    let cleaned = s.replace(/\b(?:apto|ap\.?|ap|bl\.?|bloco|apt|apt\.|casa|lt\.?|lote|qd\.?|quadra|b\d|nº|no)\b\.?\s*\S*/gi,'');
    cleaned = cleaned.replace(/\b\d+[-.]?\d*\b/g,'');
    if (/[A-Z]/.test(cleaned)) {
      let norm = cleaned.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
      for (const w of ['rua','avenida','av','travessa','trav','alameda','al','estrada','rodovia']) norm = norm.replace(new RegExp('\\b'+w+'\\b','g'),'').trim();
      norm = norm.replace(/\s+/g,' ').trim();
      if (norm.split(' ').length >= 2 && norm.length >= 8) return norm;
    }
  }
  return null;
}
function editDist(a,b){ if(a===b)return 0; if(a.length<b.length){const t=a;a=b;b=t;} if(!b.length)return a.length; let prev=Array.from({length:b.length+1},(_,i)=>i); for(let i=0;i<a.length;i++){let cur=[i+1]; for(let j=0;j<b.length;j++){cur.push(Math.min(prev[j+1]+1,cur[j]+1,prev[j]+(a[i]!==b[j]?1:0)));} prev=cur;} return prev[b.length]; }
function coresSimilar(a,b){ if(a===b)return true; if(a.includes(b)||b.includes(a))return true; const ta=new Set(a.split(' ')), tb=new Set(b.split(' ')); const inter=[...ta].filter(x=>tb.has(x)).length; if(ta.size&&tb.size&&inter>=2)return true; if(editDist(a,b)<=2)return true; return false; }

async function fetchViaCep(cep) {
  try {
    const res = await fetch('https://viacep.com.br/ws/' + cep + '/json/');
    const d = await res.json();
    if (d.erro) return null;
    return d;
  } catch(e) { return {_error: e.message}; }
}

async function processFile(file) {
  setProgress(5, 'Lendo planilha...');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
  const header = aoa[0];
  const data = aoa.slice(1).filter(r => r && r.length);
  const idx = name => header.findIndex(h => String(h).trim().toLowerCase() === name.toLowerCase());
  const I_AT = idx('AT ID'), I_SEQ = idx('Sequence'), I_STOP = idx('Stop'),
        I_SPX = idx('SPX TN'), I_ADDR = idx('Destination Address'),
        I_BAIRRO = idx('Bairro'), I_CITY = idx('City'),
        I_CEP = idx('Zipcode/Postal code'), I_LAT = idx('Latitude'), I_LNG = idx('Longitude');

  // geocoding opcional
  const useGeocode = document.getElementById('geocodeChk').checked;
  const origCoords = data.map(r => [r[I_LAT], r[I_LNG]]);
  if (useGeocode) {
    setProgress(8, 'Geocodificando endereços...');
    const uniqueAddrs = [...new Set(data.map(r => String(r[I_ADDR]) + ', ' + r[I_BAIRRO] + ', ' + r[I_CITY]))];
    const geoMap = {};
    for (let i=0;i<uniqueAddrs.length;i++) {
      const q = uniqueAddrs[i];
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q) + '&format=json&limit=1');
        const d = await res.json();
        if (d && d[0]) { geoMap[q] = [parseFloat(d[0].lat), parseFloat(d[0].lon)]; }
      } catch(e) {}
      setProgress(8 + (i/uniqueAddrs.length)*6, 'Geocodificando ' + (i+1) + '/' + uniqueAddrs.length);
      await new Promise(res=>setTimeout(res, 1100));
    }
    for (let i=0;i<data.length;i++) {
      const q = String(data[i][I_ADDR]) + ', ' + data[i][I_BAIRRO] + ', ' + data[i][I_CITY];
      if (geoMap[q]) {
        const [olat, olng] = origCoords[i];
        const [nlat, nlng] = geoMap[q];
        const dist = Math.sqrt(Math.pow((olat-nlat)*111000,2) + Math.pow((olng-nlng)*111000*Math.cos(olat*Math.PI/180),2));
        data[i][I_LAT] = nlat;
        data[i][I_LNG] = nlng;
        data[i]._geocoded = true;
        data[i]._moved = dist > 100;
      }
    }
  }
  setProgress(10, 'Consultando ViaCEP...');
  const ceps = [...new Set(data.map(r => stdCep(r[I_CEP])))];
  const viacep = {};
  for (let i=0;i<ceps.length;i++) {
    viacep[ceps[i]] = await fetchViaCep(ceps[i]);
    setProgress(10 + (i/ceps.length)*30, 'ViaCEP ' + (i+1) + '/' + ceps.length);
    await new Promise(res=>setTimeout(res, 120));
  }

  const srcBairro = {};
  for (const r of data) {
    const c = stdCep(r[I_CEP]);
    if (!srcBairro[c]) srcBairro[c] = {};
    const b = String(r[I_BAIRRO]).trim();
    srcBairro[c][b] = (srcBairro[c][b]||0)+1;
  }
  const canonBairro = {};
  const divergences = [];
  for (const c of ceps) {
    const res = viacep[c];
    const srcTop = srcBairro[c] ? Object.entries(srcBairro[c]).sort((a,b)=>b[1]-a[1])[0][0] : '';
    if (res && !res._error && res.bairro) {
      canonBairro[c] = res.bairro;
      if (res.bairro.trim().toLowerCase() !== srcTop.trim().toLowerCase()) {
        divergences.push([c, srcTop, res.bairro]);
      }
    } else {
      canonBairro[c] = srcTop;
    }
  }

  setProgress(45, 'Padronizando endereços...');
  // building core per row
  const rowCore = data.map(r => buildingCore(r[I_ADDR]));
  // cluster cores per cep by similarity
  const cepCores = {};
  for (let i=0;i<data.length;i++) {
    const c = stdCep(data[i][I_CEP]);
    if (rowCore[i]) {
      if (!cepCores[c]) cepCores[c] = new Set();
      cepCores[c].add(rowCore[i]);
    }
  }
  // canonicalize cores: pick most frequent similar core
  const coreFreq = {};
  for (let i=0;i<data.length;i++) { const rc=rowCore[i]; if (rc) coreFreq[rc]=(coreFreq[rc]||0)+1; }
  function canonicalCore(c) {
    let best=c, bestFreq=coreFreq[c]||0;
    for (const other in coreFreq) {
      if (other===c) continue;
      if (coresSimilar(c,other) && coreFreq[other]>bestFreq) { best=other; bestFreq=coreFreq[other]; }
    }
    return best;
  }
  const coreCanonical = {};
  for (const c in coreFreq) coreCanonical[c]=canonicalCore(c);

  const coreCluster = {};
  for (const c in cepCores) {
    const cores = [...cepCores[c]];
    const parent = {};
    cores.forEach(x=>parent[x]=x);
    function find(x){ while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];} return x; }
    function union(a,b){ const ra=find(a),rb=find(b); if(ra!==rb) parent[ra]=rb; }
    for (let i=0;i<cores.length;i++) for (let j=i+1;j<cores.length;j++) if (coresSimilar(cores[i],cores[j])) union(cores[i],cores[j]);
    for (const x of cores) {
      let rep = find(x);
      rep = coreCanonical[rep] || rep;
      coreCluster[c+'||'+x] = rep;
    }
  }
  const stops = new Map();
  for (let i=0;i<data.length;i++) {
    const r = data[i];
    const cep = stdCep(r[I_CEP]);
    const {formatted} = parseAddress(r[I_ADDR]);
    const rc = rowCore[i];
    let key;
    if (rc) {
      const rep = coreCluster[cep+'||'+rc] || rc;
      key = cep + '||BLD:' + rep;
    } else {
      key = cep + '||' + coreKey(formatted);
    }
    if (!stops.has(key)) stops.set(key, []);
    stops.get(key).push(i);
  }
  const stopKeys = [...stops.keys()].sort((a,b) => {
    const ca = a.split('||')[0], cb = b.split('||')[0];
    if (ca !== cb) return ca < cb ? -1 : 1;
    const ba = canonBairro[ca]||'', bb = canonBairro[cb]||'';
    if (ba !== bb) return ba < bb ? -1 : 1;
    return a < b ? -1 : 1;
  });
  const stopNumber = {};
  stopKeys.forEach((k,i) => stopNumber[k]=i+1);

  setProgress(60, 'Gerando planilha final...');
  const finalRows = [];
  for (const k of stopKeys) {
    const idxs = stops.get(k);
    const total = idxs.length;
    const cep = k.split('||')[0];
    const cb = canonBairro[cep] || '';
    const sa = parseAddress(data[idxs[0]][I_ADDR]).formatted;
    const warns0 = parseAddress(data[idxs[0]][I_ADDR]).warns;
    const obsBase = [];
    if (total > 1) obsBase.push('Mais de 1 pacote no mesmo endereço');
    const srcBairros = new Set(idxs.map(i=>String(data[i][I_BAIRRO]).trim()));
    if (srcBairros.size > 1) obsBase.push('Bairro com grafias variantes');
    obsBase.push(...warns0);
    for (let n=0;n<idxs.length;n++) {
      const i = idxs[n];
      const r = data[i];
      const w = [...obsBase];
      for (const x of parseAddress(r[I_ADDR]).warns) if (!w.includes(x)) w.push(x);
      const _pa = parseAddress(r[I_ADDR]);
      if (_pa.warns.includes('faltando quadra') && _pa.warns.includes('faltando lote') && _pa.warns.includes('faltando número')) {
        w.push('Endereço incompleto — revisar obrigatoriamente');
      }
      if (r._moved) w.push('Coordenada corrigida via geocodificação');
      finalRows.push({
        'Ordem Otimizada da Rota': stopNumber[k],
        'Parada Consolidada': stopNumber[k],
        'Número original do Pacote na Parada': n+1,
        'Quantidade Total de Pacotes na Parada': total,
        'Código do Pacote': r[I_SPX],
        'Sequence Original': r[I_SEQ],
        'Destinatário': '',
        'Endereço Original': r[I_ADDR],
        'Endereço Padronizado': (function(){ const rc = rowCore[i]; let a = parseAddress(r[I_ADDR]).formatted; if (!rc) return a; let rep = coreCluster[cep+'||'+rc] || rc; rep = coreCanonical[rep] || rep; if (rep && rep !== rc) a = a.replace(new RegExp(rc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), rep); return a; })(),
        'Bairro': cb,
        'Cidade': r[I_CITY],
        'CEP': cep,
        'Latitude': r[I_LAT],
        'Longitude': r[I_LNG],
        'Observações': w.join('; ')
      });
    }
  }

  const byBairro = new Map();
  for (const k of stopKeys) {
    const cep = k.split('||')[0];
    const cb = canonBairro[cep] || '';
    if (!byBairro.has(cb)) byBairro.set(cb, []);
    byBairro.get(cb).push(k);
  }

  setProgress(75, 'Gerando arquivos...');
  const outWb = XLSX.utils.book_new();
  const ws0 = XLSX.utils.aoa_to_sheet([header, ...data]);
  XLSX.utils.book_append_sheet(outWb, ws0, 'Dados Originais');
  const cols = ['Ordem Otimizada da Rota','Parada Consolidada','Número original do Pacote na Parada','Quantidade Total de Pacotes na Parada','Código do Pacote','Sequence Original','Destinatário','Endereço Original','Endereço Padronizado','Bairro','Cidade','CEP','Latitude','Longitude','Observações'];
  const aoaFinal = [cols, ...finalRows.map(fr => cols.map(c => fr[c]))];
  const wsf = XLSX.utils.aoa_to_sheet(aoaFinal);
  XLSX.utils.book_append_sheet(outWb, wsf, 'Planilha Final');
  const coordRows = [['Endereço','Latitude','Longitude','Motivo da suspeita']];
  const seen = new Set();
  const coordGroups = {};
  for (let i=0;i<data.length;i++) {
    const key = data[i][I_LAT]+','+data[i][I_LNG];
    if (!coordGroups[key]) coordGroups[key]=[];
    coordGroups[key].push(i);
  }
  for (const key in coordGroups) {
    const idxs = coordGroups[key];
    const addrs = new Set(idxs.map(i=>String(data[i][I_ADDR])));
    if (idxs.length>1 && addrs.size>1) {
      for (const i of idxs) {
        const k = data[i][I_ADDR]+','+data[i][I_LAT]+','+data[i][I_LNG];
        if (seen.has(k)) continue;
        seen.add(k);
        coordRows.push([data[i][I_ADDR], data[i][I_LAT], data[i][I_LNG], 'Coordenada compartilhada por múltiplos endereços distintos']);
      }
    }
  }
  const wsc = XLSX.utils.aoa_to_sheet(coordRows);
  XLSX.utils.book_append_sheet(outWb, wsc, 'Coordenadas Suspeitas');
  const missing = data.filter(r => String(r[I_CEP]).replace(/\D/g,'').length !== 8);
  const wsc2 = XLSX.utils.aoa_to_sheet([['CEP Original','CEP Padronizado','Status','Quantidade'], ['-', '-', 'Nenhum CEP faltante ou incompleto encontrado', missing.length]]);
  XLSX.utils.book_append_sheet(outWb, wsc2, 'CEPs Faltantes');
  const wsv = XLSX.utils.aoa_to_sheet([['CEP','Logradouro (ViaCEP)','Bairro (ViaCEP)','Localidade (ViaCEP)','UF','Status'], ...ceps.map(c => {
    const res = viacep[c];
    if (!res) return [c, '', '', '', '', 'CEP não encontrado'];
    if (res._error) return [c, '', '', '', '', 'Erro: ' + res._error];
    return [c, res.logradouro||'', res.bairro||'', res.localidade||'', res.uf||'', 'OK'];
  })]);
  XLSX.utils.book_append_sheet(outWb, wsv, 'ViaCEP');
  const wsa = XLSX.utils.aoa_to_sheet([['Categoria','Detalhe','Quantidade'],
    ...divergences.map(d => ['Bairro divergente (planilha vs ViaCEP)', d[0]+': planilha="'+d[1]+'" vs ViaCEP="'+d[2]+'"', 1]),
    ['Endereços consolidados (mesma parada)', 'grupos', [...stops.keys()].filter(k=>stops.get(k).length>1).length],
    ['Total de pacotes consolidados', 'pacotes', [...stops.values()].reduce((a,v)=>a+(v.length>1?v.length:0),0)],
    ['Coordenadas compartilhadas por endereços distintos', 'grupos', Object.keys(coordGroups).filter(k=>{const v=coordGroups[k]; const a=new Set(v.map(i=>String(data[i][I_ADDR]))); return v.length>1 && a.size>1;}).length]
  ]);
  XLSX.utils.book_append_sheet(outWb, wsa, 'Auditoria');
  const reportLines = [];
  reportLines.push('SEQUÊNCIA DAS ENTREGAS - ROTA COMPLETA');
  reportLines.push('TOTAL: ' + stopKeys.length + ' PARADAS  |  ' + data.length + ' PACOTES');
  reportLines.push('');
  for (const [bairro, ks] of byBairro) {
    reportLines.push(bairro.toUpperCase());
    for (const k of ks) {
      const idxs = stops.get(k);
      const sn = stopNumber[k];
      const total = idxs.length;
      const _rc0 = rowCore[idxs[0]];
      const _cep0 = k.split('||')[0];
      let sa = parseAddress(data[idxs[0]][I_ADDR]).formatted;
      if (_rc0) { let _rep = coreCluster[_cep0+'||'+_rc0] || _rc0; _rep = coreCanonical[_rep] || _rep; if (_rep && _rep !== _rc0) sa = sa.replace(new RegExp(_rc0.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), _rep); }
      const seqs = idxs.map(i=>data[i][I_SEQ]).join(', ');
      for (let n=0;n<idxs.length;n++) {
        const i = idxs[n];
        const r = data[i];
        const flag = total > 1 ? '  (mais de 1 pacote)' : '';
        reportLines.push('  Parada ' + sn + ' | ' + sa + ' | Seq ' + r[I_SEQ] + ' | ' + total + ' pac' + flag);
      }
      if (total > 1) reportLines.push('     -> ' + total + ' pacotes no mesmo endereço (Seq: ' + seqs + ')');
    }
    reportLines.push('');
  }
  const wsr = XLSX.utils.aoa_to_sheet(reportLines.map(l=>[l]));
  XLSX.utils.book_append_sheet(outWb, wsr, 'Relatorio Visual');

  const xlsxArray = XLSX.write(outWb, {bookType:'xlsx', type:'array'});
  const xlsxBlob = new Blob([xlsxArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const mdBlob = new Blob([reportLines.join('\n')], {type:'text/markdown;charset=utf-8'});

  // render HTML report
  renderHtmlReport(byBairro, stops, stopNumber, data, I_ADDR, I_SEQ);

  downloadsDiv.innerHTML = '';
  addDownload('Planilha otimizada (.xlsx)', xlsxBlob, baseName() + ' - otimizado.xlsx');
  addDownload('Relatório visual (.md)', mdBlob, 'Relatorio Visual - Rota de Entrega.md');
  // PNG from html2canvas
  const reportEl = document.getElementById('report');
  html2canvas(reportEl, {scale: 2, backgroundColor: '#ffffff'}).then(canvas => {
    canvas.toBlob(blob => addDownload('Relatório visual (.png)', blob, 'Relatorio Visual - Rota de Entrega.png'), 'image/png');
  });

  setProgress(100, 'Concluído!');
  downloadsCard.style.display = 'block';
  statusEl.className = 'status ok';
}

function baseName() { return selectedFile ? selectedFile.name.replace(/\.[^.]+$/,'') : 'planilha'; }

function addDownload(label, blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.textContent = label;
  downloadsDiv.appendChild(a);
}

function renderHtmlReport(byBairro, stops, stopNumber, data, I_ADDR, I_SEQ) {
  const container = document.getElementById('report');
  container.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = 'SEQUÊNCIA DAS ENTREGAS - ROTA COMPLETA';
  container.appendChild(title);
  const sub = document.createElement('div');
  sub.className = 'subtitle';
  sub.textContent = 'TOTAL: ' + stops.size + ' PARADAS  |  ' + data.length + ' PACOTES';
  container.appendChild(sub);
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = '<span class="l1">Nº Shopee = parada original</span><span class="l2">Nº Azul = nossa numeração</span><span class="l3">Mais de 1 pacote no mesmo endereço</span>';
  container.appendChild(legend);
  const cols = document.createElement('div');
  cols.className = 'cols';
  // distribute bairros into 3 columns by balanced height
  const bairroList = [...byBairro.entries()];
  const columns = [[],[],[]];
  const colH = [0,0,0];
  for (const [name, ks] of bairroList) {
    let bh = 16 + 12;
    for (const k of ks) {
      const idxs = stops.get(k);
      bh += idxs.length*13;
      if (idxs.length>1) bh += 12;
    }
    bh += 6;
    const idx = colH.indexOf(Math.min(...colH));
    columns[idx].push([name, ks]);
    colH[idx] += bh;
  }
  for (let ci=0; ci<3; ci++) {
    const col = document.createElement('div');
    for (const [name, ks] of columns[ci]) {
      const card = document.createElement('div');
      card.className = 'bairro';
      const hdr = document.createElement('div');
      hdr.className = 'bairro-header';
      hdr.textContent = name;
      card.appendChild(hdr);
      // column headers
      const hrow = document.createElement('div');
      hrow.className = 'row';
      hrow.style.fontWeight = '700';
      hrow.style.color = '#555';
      hrow.innerHTML = '<div>Nº</div><div>Endereço</div><div>Seq</div><div>Pac</div>';
      card.appendChild(hrow);
      for (const k of ks) {
        const idxs = stops.get(k);
        const sn = stopNumber[k];
        const total = idxs.length;
        const addr = parseAddress(data[idxs[0]][I_ADDR]).formatted;
        for (let n=0;n<idxs.length;n++) {
          const i = idxs[n];
          const seq = data[i][I_SEQ];
          const row = document.createElement('div');
          row.className = 'row';
          const num = document.createElement('div');
          num.className = 'num';
          num.textContent = sn;
          const a = document.createElement('div');
          a.className = 'addr';
          a.textContent = addr;
          const s = document.createElement('div');
          s.className = 'seq';
          s.textContent = 'Seq ' + seq;
          const c = document.createElement('div');
          c.className = 'cnt' + (total>1?' multi':'');
          c.textContent = total + 'pac';
          row.appendChild(num); row.appendChild(a); row.appendChild(s); row.appendChild(c);
          card.appendChild(row);
        }
        if (total > 1) {
          const cons = document.createElement('div');
          cons.className = 'consolidated';
          cons.textContent = '-> ' + total + ' pacotes no mesmo endereço';
          card.appendChild(cons);
        }
      }
      col.appendChild(card);
    }
    cols.appendChild(col);
  }
  container.appendChild(cols);
  reportWrap.style.display = 'block';
}
</script>
</body>
</html>
